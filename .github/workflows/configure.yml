name: Configure

# DEPRECATED: kept as a thin facade over `prepare.yml` so existing callers keep
# working. New callers must use `prepare` directly. The workflow_call surface
# below must stay byte-identical (contracts/configure.json) until consumers
# migrate — see tools/check-contracts.mjs for what counts as breaking.

on:
  workflow_call:
    inputs:
      php-version:
        default: ${{ vars.PHP_VERSION || '8.2' }}
        type: string
      laravel-version:
        required: false
        type: string
      target-env:
        default: testing
        type: string
    secrets:
      CC_TEST_REPORTER_ID:
        required: false
      COVERALLS_REPO_TOKEN:
        required: false
    outputs:
      # Composer
      composer-cache-dir:
        value: ${{ jobs.prepare.outputs.composer-cache-dir }}
      composer-cache-key:
        value: ${{ jobs.environments.outputs.composer-cache-key }}
      # Docer Built
      image-tag:
        value: ${{ jobs.environments.outputs.image-tag }}
      # Deployment
      should-deploy:
        value: ${{ jobs.prepare.outputs.should-deploy }}
      target-env:
        value: ${{ jobs.environments.outputs.target-env }}
      # Repository
      repository-name:
        value: ${{ jobs.environments.outputs.repository-name }}
      target-branch:
        value: ${{ jobs.environments.outputs.target-branch }}
      # Test Reports
      should-reports:
        value: ${{ jobs.prepare.outputs.should-reports }}
      has-codeclimate:
        value: '0'
        description: 'Deprecated'
      has-coveralls:
        value: ${{ jobs.prepare.outputs.has-coveralls }}

jobs:
  # Supplies the outputs `prepare` does not produce and keeps the values this
  # workflow always returned (image tag, repository/branch naming, deploy
  # target, composer cache key). Pure shell — no PHP/Composer setup needed.
  # Its first step is also the deprecation notice: merged in here (instead of
  # a dedicated job) so the facade costs one runner job less.
  environments:
    name: Environments
    runs-on: ubuntu-latest
    outputs:
      composer-cache-key: ${{ steps.composer.outputs.composer-cache-key }}
      image-tag: ${{ steps.environment.outputs.image-tag }}
      repository-name: ${{ steps.repo.outputs.lower-name }}
      target-branch: ${{ steps.repo.outputs.branch-name }}
      target-env: ${{ steps.deploy.outputs.target-env }}

    steps:
      - name: Deprecation notice
        run: |
          # shellcheck disable=SC2016 # literal backticks render markdown code spans in the summary
          {
            echo '::warning::`configure` is deprecated — call the `prepare` workflow instead.'
            echo '## ⚠️ `configure` is deprecated'
            echo ''
            echo 'This workflow now delegates to `prepare`. Point your job at `projek-xyz/actions/.github/workflows/prepare.yml` instead of `projek-xyz/actions/.github/workflows/configure.yml`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository
        id: repo
        run: |
          # Extract repository name and convert to lowercase
          echo "lower-name=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

          # Extract repository branch name
          echo "branch-name=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"

          if [ -f ./package.json ]; then
            # Extract version number from `package.json` file
            echo "app-version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Environment
        id: environment
        env:
          APP_VERSION: ${{ steps.repo.outputs.app-version }}
          BRANCH_NAME: ${{ steps.repo.outputs.branch-name }}
        run: |
          # Generate image tag with timestamp and commit
          echo "image-tag=${APP_VERSION}-${BRANCH_NAME}.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        env:
          BRANCH_NAME: ${{ steps.repo.outputs.branch-name }}
          TARGET_ENV: ${{ inputs.target-env }}
        run: |
          # Set deployment environment
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "target-env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH_NAME" == "main" ]]; then
            echo "target-env=develop" >> "$GITHUB_OUTPUT"
          else
            echo "target-env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Composer Cache Key
        id: composer
        env:
          LARAVEL_VERSION: ${{ inputs.laravel-version }}
          COMPOSER_CACHE_KEY: php-${{ inputs.php-version }}
        run: |
          # The cache directory comes from `prepare`; the key is a pure string.
          # Non-composer projects keep the empty value they never reached before
          # (the old job failed instead) — deprecation must not add failures.
          if [ -f ./composer.json ]; then
            if [ -n "${LARAVEL_VERSION}" ]; then
              COMPOSER_CACHE_KEY="${COMPOSER_CACHE_KEY}-l${LARAVEL_VERSION}"
            fi
            echo "composer-cache-key=${COMPOSER_CACHE_KEY}" >> "$GITHUB_OUTPUT"
          fi

  # Delegates detection/reporting outputs to `prepare`. Its identical `labels`
  # job also replaces this workflow's own (removed) labels job: whenever the
  # caller's event is `pull_request`, labeling runs through this call.
  prepare:
    name: Prepare
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/prepare.yml
    with:
      php-version: ${{ inputs.php-version }}
      target-env: ${{ inputs.target-env }}
    secrets:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
